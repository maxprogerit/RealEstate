<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property - Real Estate Marketplace</title>
    <link rel="stylesheet" href="/css/style.css">
    <script th:inline="javascript">
        const GOOGLE_MAPS_API_KEY = /*[[${googleMapsApiKey}]]*/ 'YOUR_API_KEY';
    </script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🏠 Real Estate Marketplace</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/properties">Properties</a></li>
                <li><a href="/map">Map View</a></li>
                <li><a href="/add-property" class="active">Add Property</a></li>
                <li><a href="/saved">Saved</a></li>
                <li><a href="/alerts">Alerts</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-content">
        <div class="container">
            <div class="form-container">
                <h2 style="margin-bottom: 2rem;">List Your Property</h2>
                <form id="propertyForm">
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="title" required placeholder="e.g., Beautiful 3BR House with Garden">
                    </div>

                    <div class="form-group">
                        <label>Description *</label>
                        <textarea id="description" required placeholder="Describe your property..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Price ($) *</label>
                            <input type="number" id="price" required placeholder="250000">
                        </div>

                        <div class="form-group">
                            <label>Property Type *</label>
                            <select id="propertyType" required>
                                <option value="">Select Type</option>
                                <option value="HOUSE">House</option>
                                <option value="APARTMENT">Apartment</option>
                                <option value="CONDO">Condo</option>
                                <option value="TOWNHOUSE">Townhouse</option>
                                <option value="VILLA">Villa</option>
                                <option value="LAND">Land</option>
                                <option value="COMMERCIAL">Commercial</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Status *</label>
                            <select id="status" required>
                                <option value="">Select Status</option>
                                <option value="FOR_SALE">For Sale</option>
                                <option value="FOR_RENT">For Rent</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Bedrooms *</label>
                            <input type="number" id="bedrooms" required min="0" placeholder="3">
                        </div>

                        <div class="form-group">
                            <label>Bathrooms *</label>
                            <input type="number" id="bathrooms" required min="0" placeholder="2">
                        </div>

                        <div class="form-group">
                            <label>Square Feet *</label>
                            <input type="number" id="squareFeet" required min="1" placeholder="2000">
                        </div>

                        <div class="form-group">
                            <label>Year Built</label>
                            <input type="number" id="yearBuilt" min="1800" max="2026" placeholder="2020">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Address *</label>
                        <input type="text" id="address" required placeholder="123 Main Street">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>City *</label>
                            <input type="text" id="city" required placeholder="San Francisco">
                        </div>

                        <div class="form-group">
                            <label>State *</label>
                            <input type="text" id="state" required placeholder="CA">
                        </div>

                        <div class="form-group">
                            <label>Zip Code *</label>
                            <input type="text" id="zipCode" required placeholder="94102">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Latitude *</label>
                            <input type="number" id="latitude" step="any" required placeholder="37.7749">
                        </div>

                        <div class="form-group">
                            <label>Longitude *</label>
                            <input type="number" id="longitude" step="any" required placeholder="-122.4194">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Lot Size (sq ft)</label>
                            <input type="number" id="lotSize" min="0" placeholder="5000">
                        </div>

                        <div class="form-group" style="display: flex; gap: 1rem; align-items: center; margin-top: 2rem;">
                            <label style="margin: 0;">
                                <input type="checkbox" id="hasGarage"> Has Garage
                            </label>
                            <label style="margin: 0;">
                                <input type="checkbox" id="hasPool"> Has Pool
                            </label>
                            <label style="margin: 0;">
                                <input type="checkbox" id="hasGarden"> Has Garden
                            </label>
                        </div>
                    </div>

                    <div style="margin-top: 2rem;">
                        <button type="submit" class="btn btn-primary btn-large">Submit Property</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Real Estate Marketplace. All rights reserved.</p>
        </div>
    </footer>

    <script src="/js/app.js"></script>
    <script src="/js/add-property.js"></script>
</body>
</html>
