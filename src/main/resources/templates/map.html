<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map View - Real Estate Marketplace</title>
    <link rel="stylesheet" href="/css/style.css">
    <script th:inline="javascript">
        const GOOGLE_MAPS_API_KEY = /*[[${googleMapsApiKey}]]*/ 'YOUR_API_KEY';
    </script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🏠 Real Estate Marketplace</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/properties">Properties</a></li>
                <li><a href="/map" class="active">Map View</a></li>
                <li><a href="/add-property">Add Property</a></li>
                <li><a href="/saved">Saved</a></li>
                <li><a href="/alerts">Alerts</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-content">
        <div class="container">
            <div class="page-header">
                <h2>Interactive Map View</h2>
                <p>Explore properties on the map</p>
            </div>

            <div class="filters-container" style="margin-bottom: 1rem;">
                <div class="filters-grid">
                    <div class="filter-group">
                        <label>City</label>
                        <input type="text" id="mapCity" placeholder="Enter city">
                    </div>
                    <div class="filter-group">
                        <label>Property Type</label>
                        <select id="mapPropertyType">
                            <option value="">All Types</option>
                            <option value="HOUSE">House</option>
                            <option value="APARTMENT">Apartment</option>
                            <option value="CONDO">Condo</option>
                            <option value="TOWNHOUSE">Townhouse</option>
                            <option value="VILLA">Villa</option>
                            <option value="LAND">Land</option>
                            <option value="COMMERCIAL">Commercial</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="updateMapProperties()">Update Map</button>
            </div>

            <div id="map"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Real Estate Marketplace. All rights reserved.</p>
        </div>
    </footer>

    <script src="/js/app.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const apiKey = /*[[${googleMapsApiKey}]]*/ 'YOUR_API_KEY';
        /*]]>*/
    </script>
    <script th:src="@{https://maps.googleapis.com/maps/api/js(key=${googleMapsApiKey},callback=initMap)}" async defer></script>
    <script src="/js/map.js"></script>
</body>
</html>
