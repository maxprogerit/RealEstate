<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Alerts - Real Estate Marketplace</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🏠 Real Estate Marketplace</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/properties">Properties</a></li>
                <li><a href="/map">Map View</a></li>
                <li><a href="/add-property">Add Property</a></li>
                <li><a href="/saved">Saved</a></li>
                <li><a href="/alerts" class="active">Alerts</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-content">
        <div class="container">
            <div class="page-header">
                <h2>Property Alerts</h2>
                <p>Get notified when new properties match your criteria</p>
            </div>

            <div class="form-container">
                <h3 style="margin-bottom: 1.5rem;">Create New Alert</h3>
                <form id="alertForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" id="userEmail" required placeholder="your@email.com">
                        </div>

                        <div class="form-group">
                            <label>Min Price</label>
                            <input type="number" id="alertMinPrice" placeholder="Min Price">
                        </div>

                        <div class="form-group">
                            <label>Max Price</label>
                            <input type="number" id="alertMaxPrice" placeholder="Max Price">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Min Bedrooms</label>
                            <input type="number" id="alertMinBedrooms" placeholder="Min Bedrooms">
                        </div>

                        <div class="form-group">
                            <label>Max Bedrooms</label>
                            <input type="number" id="alertMaxBedrooms" placeholder="Max Bedrooms">
                        </div>

                        <div class="form-group">
                            <label>Property Type</label>
                            <select id="alertPropertyType">
                                <option value="">All Types</option>
                                <option value="HOUSE">House</option>
                                <option value="APARTMENT">Apartment</option>
                                <option value="CONDO">Condo</option>
                                <option value="TOWNHOUSE">Townhouse</option>
                                <option value="VILLA">Villa</option>
                                <option value="LAND">Land</option>
                                <option value="COMMERCIAL">Commercial</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" id="alertCity" placeholder="Enter city">
                        </div>

                        <div class="form-group">
                            <label>State</label>
                            <input type="text" id="alertState" placeholder="Enter state">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Create Alert</button>
                </form>
            </div>

            <div style="margin-top: 3rem;">
                <h3 style="margin-bottom: 1.5rem;">Your Alerts</h3>
                <div id="alertsContainer">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Real Estate Marketplace. All rights reserved.</p>
        </div>
    </footer>

    <script src="/js/app.js"></script>
    <script src="/js/alerts.js"></script>
</body>
</html>
